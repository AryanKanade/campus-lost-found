<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Items | Campus Lost & Found</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="/styles.css">

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        defer
    ></script>
    <script src="/js/browse.js" defer></script>
    <script src="/js/nav.js" defer></script>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark site-nav">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">Campus Lost & Found</a>

            <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#mainNav"
                aria-controls="mainNav" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/browse.html">Browse Lost & Found</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link nav-report-btn" href="/report.html">Report an Item</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        <div class="page-heading mb-4">
            <p class="section-eyebrow">EXPLORE CAMPUS REPORTS</p>
            <h1 class="h2">Browse Lost & Found Items</h1>
            <p class="text-secondary">
                Search and filter reports to find the item you are looking for.
            </p>
        </div>

        <section class="card report-card mb-4">
            <div class="card-body p-4">
                <form id="browseForm">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="searchKeyword" class="form-label">
                                Search by keyword
                            </label>
                            <input type="search" id="searchKeyword"
                                name="search" class="form-control"
                                maxlength="100"
                                placeholder="e.g. wallet, phone, library">
                        </div>

                        <div class="col-md-6">
                            <label for="filterReportType" class="form-label">
                                Report type
                            </label>
                            <select id="filterReportType" name="report_type"
                                class="form-select">
                                <option value="">All reports</option>
                                <option value="LOST">Lost items</option>
                                <option value="FOUND">Found items</option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label for="filterCategory" class="form-label">
                                Category
                            </label>
                            <select id="filterCategory" name="category"
                                class="form-select">
                                <option value="">All categories</option>
                                <option value="Electronics">Electronics</option>
                                <option value="ID or Wallet">ID or Wallet</option>
                                <option value="Keys">Keys</option>
                                <option value="Clothing">Clothing</option>
                                <option value="Books or Stationery">
                                    Books or Stationery
                                </option>
                                <option value="Accessories">Accessories</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label for="filterLocation" class="form-label">
                                Location
                            </label>
                            <input type="text" id="filterLocation"
                                name="location" class="form-control"
                                maxlength="150"
                                placeholder="e.g. Library, canteen">
                        </div>

                        <div class="col-12 d-flex flex-wrap gap-2 mt-4">
                            <button id="applyFiltersButton" type="submit"
                                class="btn btn-primary">
                                Search & Filter
                            </button>
                            <button id="clearFiltersButton" type="button"
                                class="btn btn-outline-secondary">
                                Clear Filters
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </section>

        <section aria-labelledby="resultsHeading">
            <div class="d-flex justify-content-between align-items-center
                        flex-wrap gap-2 mb-3">
                <h2 id="resultsHeading" class="h4 mb-0">Reported Items</h2>
                <span id="resultsSummary" class="text-secondary small"
                    aria-live="polite">
                    Loading reports...
                </span>
            </div>

            <div id="browseMessage" class="alert d-none"
                role="status" aria-live="polite"></div>

            <div id="reportResults" class="row g-3"></div>
        </section>
    </main>

    <footer class="app-footer text-center py-4">
        Campus Lost & Found Management System
    </footer>
</body>
</html>
